<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Message sent • TrueCost</title>

  <style>
    :root {
      --bg: #081225;
      --card: rgba(255, 255, 255, 0.08);
      --card-border: rgba(255, 255, 255, 0.12);
      --text: #f5f7fb;
      --muted: #b7c2d6;
      --accent: #4da3ff;
      --accent-hover: #78b8ff;
      --radius: 18px;
      --max-width: 520px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at top, #16325f 0%, #0c1830 42%, #07101f 100%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      width: 100%;
      max-width: var(--max-width);
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      padding: 32px;
      text-align: center;
      backdrop-filter: blur(10px);
    }

    h1 {
      margin: 0 0 12px;
      font-size: 28px;
    }

    p {
      margin: 0 0 24px;
      color: var(--muted);
      line-height: 1.6;
    }

    .button {
      display: inline-block;
      padding: 14px 22px;
      border-radius: 12px;
      background: var(--accent);
      color: white;
      font-weight: 600;
      text-decoration: none;
      transition: 0.18s ease;
    }

    .button:hover {
      background: var(--accent-hover);
    }
  </style>
</head>

<body>
  <main class="card">
    <h1>Message sent</h1>
    <p>
      Thanks for reaching out. Your message has been received and we’ll get back to you shortly.
    </p>

    <a class="button" href="../">Return to home</a>
  </main>
</body>
</html>
