<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TrueCost Support</title>
  <meta name="description" content="Contact TrueCost support.">

  <style>
    :root {
      --bg: #081225;
      --card: rgba(255, 255, 255, 0.08);
      --card-border: rgba(255, 255, 255, 0.12);
      --text: #f5f7fb;
      --muted: #b7c2d6;
      --accent: #4da3ff;
      --accent-hover: #78b8ff;
      --radius: 18px;
      --max-width: 640px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at top, #16325f 0%, #0c1830 42%, #07101f 100%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      width: 100%;
      max-width: var(--max-width);
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      padding: 28px;
      backdrop-filter: blur(10px);
    }

    h1 {
      margin: 0 0 10px;
      font-size: 28px;
    }

    .subtitle {
      margin: 0 0 24px;
      color: var(--muted);
      line-height: 1.5;
      font-size: 15px;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    label {
      display: flex;
      flex-direction: column;
      font-size: 13px;
      color: var(--muted);
      gap: 6px;
    }

    input, select, textarea {
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.12);
      background: rgba(255,255,255,0.06);
      color: var(--text);
      font-size: 14px;
    }

    input::placeholder,
    textarea::placeholder {
      color: rgba(255,255,255,0.4);
    }

    textarea {
      resize: vertical;
      min-height: 120px;
    }

    button {
      margin-top: 8px;
      padding: 14px;
      border-radius: 12px;
      border: none;
      background: var(--accent);
      color: white;
      font-weight: 600;
      cursor: pointer;
      transition: 0.18s ease;
    }

    button:hover {
      background: var(--accent-hover);
    }

    .footnote {
      margin-top: 16px;
      font-size: 13px;
      color: var(--muted);
      text-align: center;
    }

    .back {
      display: inline-block;
      margin-bottom: 18px;
      font-size: 13px;
      color: var(--muted);
      text-decoration: none;
    }

    .back:hover {
      color: var(--text);
    }
  </style>
</head>

<body>
  <main class="card">
    <a class="back" href="../">← Back</a>

    <h1>Support</h1>
    <p class="subtitle">
      Need help or want to report an issue? Send a message below and we’ll get back to you.
    </p>

    <form action="https://formspree.io/f/mykljble" method="POST">

      <label>
        Name
        <input type="text" name="name" placeholder="Your name" required>
      </label>

      <label>
        Email
        <input type="email" name="email" placeholder="you@email.com" required>
      </label>

      <label>
        Issue type
        <select name="issue">
          <option>Bug report</option>
          <option>Feature request</option>
          <option>General question</option>
        </select>
      </label>

      <label>
        Message
        <textarea name="message" placeholder="Describe your issue or question…" required></textarea>
      </label>

      <!-- Optional: redirect after submit -->
      <input type="hidden" name="_redirect" value="https://mitch-1211.github.io/TrueCost-Docs/support/success.html">

      <button type="submit">Send message</button>
    </form>

    <p class="footnote">
      We typically respond within 1–2 business days.
    </p>
  </main>
</body>
</html>
